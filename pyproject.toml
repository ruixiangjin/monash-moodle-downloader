[project]
name = "monash-moodle-downloader"
version = "0.1.0"
description = "Download authorised Monash Moodle course resources for offline study."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "markdownify>=1.1.0",
    "platformdirs>=4.3.0",
    "playwright>=1.50.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
mmd = "monash_moodle_downloader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
